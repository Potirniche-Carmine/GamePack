[package]
name = "gamepack-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
build = "build.rs"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
anyhow = "1.0"
blake3 = "1.8"
cxx = "1.0"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.18", features = ["v4"] }

[build-dependencies]
cxx-build = "1.0"

[dev-dependencies]
tempfile = "3.22"

