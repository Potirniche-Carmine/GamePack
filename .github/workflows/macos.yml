name: macOS native builds

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always

jobs:
  macos:
    if: github.ref == 'refs/heads/main'
    name: macOS ${{ matrix.arch }} desktop app
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            build_jobs: 3
          - runner: macos-15-intel
            arch: x64
            build_jobs: 4
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      GAMEPACK_BUILD_JOBS: ${{ matrix.build_jobs }}
      GAMEPACK_PACKAGE_ARCH: ${{ matrix.arch }}
      GAMEPACK_SKIP_TESTS: '1'
      GAMEPACK_SKIP_DEPENDENCIES: '1'
      GAMEPACK_CCACHE: '1'
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Verify updater failure and rollback contracts before compiling the app
        run: bash scripts/ci/test-macos-updater.sh
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: macos-${{ matrix.arch }}
          env-vars: MACOSX_DEPLOYMENT_TARGET
          cache-on-failure: true
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Identify native tools and install compiler cache
        id: tools
        run: |
          command -v ccache >/dev/null || brew install ccache
          ccache --set-config "cache_dir=$RUNNER_TEMP/ccache"
          ccache --set-config max_size=500M
          ccache --set-config compression=true
          ccache --set-config depend_mode=true
          ccache --set-config sloppiness=clang_index_store,ivfsoverlay,pch_defines,modules,time_macros
          {
            echo "ccache=$(ccache --get-config cache_dir)"
            echo "xcode=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)"
            echo "dependencies=$(node scripts/ci/macos-cache-key.mjs)"
          } >> "$GITHUB_OUTPUT"
      - name: Cache CocoaPods dependencies
        id: pods-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            macos/Pods
            ~/Library/Caches/CocoaPods
          key: pods-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.tools.outputs.xcode }}-${{ steps.tools.outputs.dependencies }}
          restore-keys: pods-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.tools.outputs.xcode }}-
      - name: Cache native compilation
        id: compiler-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.tools.outputs.ccache }}
          key: ccache-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.tools.outputs.xcode }}-${{ steps.tools.outputs.dependencies }}-${{ github.sha }}
          restore-keys: ccache-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.tools.outputs.xcode }}-${{ steps.tools.outputs.dependencies }}-
      - name: Restore Xcode build intermediates
        id: xcode-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/macos
          key: xcode-v1-${{ runner.arch }}-${{ steps.tools.outputs.xcode }}-${{ steps.tools.outputs.dependencies }}-${{ hashFiles('scripts/build-macos.sh') }}-${{ github.sha }}
          restore-keys: xcode-v1-${{ runner.arch }}-${{ steps.tools.outputs.xcode }}-${{ steps.tools.outputs.dependencies }}-${{ hashFiles('scripts/build-macos.sh') }}-
      - name: Install locked JavaScript and CocoaPods dependencies
        run: |
          ccache --zero-stats
          npm ci --prefer-offline --no-audit --no-fund
          cp macos/Podfile.lock "$RUNNER_TEMP/gamepack-Podfile.lock"
          bundle exec pod install --project-directory=macos
          bundle exec ruby scripts/ci/verify-pod-lock.rb "$RUNNER_TEMP/gamepack-Podfile.lock" macos/Podfile.lock
      - name: Save verified CocoaPods dependencies
        if: steps.pods-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            macos/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ steps.pods-cache.outputs.cache-primary-key }}
      - name: Verify macOS Rust contracts
        if: matrix.arch == 'arm64'
        run: cargo test --workspace --locked
      - name: Build the native macOS app
        run: bash scripts/build-macos.sh
      - name: Report compiler cache statistics
        if: always()
        run: ccache --show-stats
      - name: Save Xcode build intermediates
        if: ${{ !cancelled() && steps.xcode-cache.outcome == 'success' && steps.xcode-cache.outputs.cache-hit != 'true' && success() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/macos
          key: ${{ steps.xcode-cache.outputs.cache-primary-key }}
      - name: Save compiler cache for the next build
        if: ${{ !cancelled() && steps.compiler-cache.outcome == 'success' && steps.compiler-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.tools.outputs.ccache }}
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - name: Verify native architecture and embedded resources
        run: |
          native_arch="$GAMEPACK_PACKAGE_ARCH"
          [[ "$native_arch" != x64 ]] || native_arch=x86_64
          test "$(lipo -archs dist/GamePack.app/Contents/MacOS/GamePack)" = "$native_arch"
          test -s dist/GamePack.app/Contents/Resources/main.jsbundle
          codesign --verify --deep --strict dist/GamePack.app
      - name: Package the app and installer
        run: bash scripts/package-macos.sh
      - name: Verify update validation and the packaged archive
        run: bash scripts/ci/test-macos-updater.sh "dist/packages/GamePack-macos-$GAMEPACK_PACKAGE_ARCH.tar.gz" dist/GamePack.app
      - name: Verify packaged installation and replacement
        run: bash scripts/ci/verify-macos-install.sh "dist/packages/GamePack-macos-$GAMEPACK_PACKAGE_ARCH.dmg" "dist/packages/GamePack-macos-$GAMEPACK_PACKAGE_ARCH.tar.gz" "$RUNNER_TEMP/gamepack-install-verification"
      - name: Upload macOS desktop package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos-${{ matrix.arch }}
          path: dist/packages/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload compiler diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-macos-${{ matrix.arch }}
          path: artifacts/local/macos-build.log
          if-no-files-found: ignore
          retention-days: 7
