name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version_tag:
        description: Version to release (for example v1.0.4)
        required: false
        type: string
      ci_run_id:
        description: Successful CI run for current main with all four native artifacts
        required: false
        type: string
      publish:
        description: Publish after signing, notarization and verification
        required: true
        type: boolean
        default: true
      verify_signing:
        description: Check signing credentials without preparing or publishing a release
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  source:
    name: Select verified release source
    if: >-
      github.ref == 'refs/heads/main' && !inputs.verify_signing &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        contains(fromJSON('["push","workflow_dispatch"]'), github.event.workflow_run.event) &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      prepare: ${{ steps.source.outputs.prepare }}
      tag: ${{ steps.source.outputs.tag }}
      commit: ${{ steps.source.outputs.commit }}
      ci_run: ${{ steps.source.outputs.ci_run }}
    env:
      GH_TOKEN: ${{ github.token }}
      CI_RUN_ID: ${{ inputs.ci_run_id || github.event.workflow_run.id }}
      REQUESTED_RELEASE_TAG: ${{ inputs.version_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Verify source, version, artifacts and release identity
        id: source
        run: node scripts/release/select-release.mjs

  release:
    name: Sign, verify and publish
    needs: source
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      (needs.source.outputs.prepare == 'true' ||
       (github.event_name == 'workflow_dispatch' && inputs.verify_signing))
    runs-on: macos-15
    timeout-minutes: 75
    concurrency:
      group: release-${{ needs.source.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      CI_RUN_ID: ${{ needs.source.outputs.ci_run }}
      RELEASE_TAG: ${{ needs.source.outputs.tag }}
      PUBLISH_RELEASE: ${{ github.event_name == 'workflow_run' || inputs.publish }}
      MACOS_SIGN_IDENTITY: ${{ vars.MACOS_SIGN_IDENTITY || 'FB6753A6FCBE197440100A34EB795D25C2F259AC' }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || 'P3UF4Y6ASK' }}
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Configure temporary signing and notarization credentials
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: bash scripts/ci/configure-release-signing.sh
      - name: Ensure PowerShell is available for Windows artifact validation
        if: needs.source.outputs.prepare == 'true'
        run: bash scripts/ci/install-release-powershell.sh
      - name: Prepare signed packages and publish verified release
        if: needs.source.outputs.prepare == 'true'
        run: |
          options=(--ci-run "$CI_RUN_ID" --sign-identity "$GAMEPACK_MACOS_SIGN_IDENTITY" --notary-profile "$GAMEPACK_NOTARY_PROFILE")
          if [[ "$PUBLISH_RELEASE" == true ]]; then options+=(--publish); fi
          npm run release:prepare -- "${options[@]}"
      - name: Remove temporary signing credentials
        if: always()
        run: |
          keychain="$RUNNER_TEMP/gamepack-release.keychain-db"
          if [[ -f "$keychain" ]]; then security delete-keychain "$keychain"; fi
          rm -f "$RUNNER_TEMP/gamepack-signing.p12"
