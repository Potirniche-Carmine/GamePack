name: Windows native build
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE', 'native/macos/**', 'macos/**', 'scripts/*-macos.sh', 'scripts/configure-macos.rb', 'scripts/make-icon.swift', '.github/workflows/macos.yml']
  pull_request:
    paths-ignore: ['**.md', 'LICENSE', 'native/macos/**', 'macos/**', 'scripts/*-macos.sh', 'scripts/configure-macos.rb', 'scripts/make-icon.swift', '.github/workflows/macos.yml']
  workflow_dispatch:
  workflow_call:
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
permissions:
  contents: read
jobs:
  windows:
    name: Windows ${{ matrix.architecture }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, arm64]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Rust, shared JS, Windows C++ host and MSIX layout
        shell: powershell
        run: ./scripts/windows/build.ps1 -Architecture ${{ matrix.architecture }}
      - name: Create installable Windows development ZIP
        shell: powershell
        run: ./scripts/windows/package.ps1 -Architecture ${{ matrix.architecture }}
      - name: Upload Windows release package
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-${{ matrix.architecture }}
          if-no-files-found: error
          path: artifacts/windows/release/*
      - name: Upload native package and compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GamePack-windows-${{ matrix.architecture }}
          if-no-files-found: warn
          path: |
            artifacts/windows/packages/**
            artifacts/windows/*.binlog
            apps/windows/GamePack.Package/bin/**/Release/**
