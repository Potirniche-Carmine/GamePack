name: Windows native build
# Paused during development. Re-enabling requires explicit user authorization.
on:
  workflow_dispatch:
    inputs:
      contract_only:
        type: boolean
        default: false
        description: Run protocol fixtures only
  workflow_call:
    inputs:
      contract_only:
        type: boolean
        default: false
        required: false

concurrency:
  group: windows-${{ github.ref }}-${{ inputs.contract_only == true && 'contracts' || 'native' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
permissions:
  contents: read
jobs:
  contracts:
    if: ${{ false && github.ref == 'refs/heads/main' && inputs.contract_only == true }}
    name: Windows PowerShell protocol fixtures

    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-contracts
          cache-on-failure: true
      - name: Build host Rust CLI and test the native JSON transport
        shell: powershell
        run: |
          cargo build --locked --bin gamepack
          if ($LASTEXITCODE -ne 0) { throw 'Could not compile the Rust fixture CLI.' }
          ./scripts/windows/test-contract.ps1 -CoreExecutable (Join-Path (Get-Location) 'target\debug\gamepack.exe')
  windows:
    if: ${{ false && github.ref == 'refs/heads/main' && inputs.contract_only != true }}

    name: Windows ${{ matrix.architecture }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, arm64]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-${{ matrix.architecture }}
          cache-on-failure: true
      - name: Build Rust, shared JS, Windows C++ host and MSIX layout
        shell: powershell
        run: ./scripts/windows/build.ps1 -Architecture ${{ matrix.architecture }}
      - name: Create installable Windows development ZIP
        shell: powershell
        run: ./scripts/windows/package.ps1 -Architecture ${{ matrix.architecture }}
      - name: Upload Windows release package
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-${{ matrix.architecture }}
          retention-days: 7
          if-no-files-found: error
          path: artifacts/windows/release/*
      - name: Upload native package and compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GamePack-windows-${{ matrix.architecture }}
          retention-days: 1
          if-no-files-found: warn
          path: |
            artifacts/windows/packages/**
            artifacts/windows/*.binlog
            apps/windows/GamePack.Package/bin/**/Release/**
