name: Windows native build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Rust, shared JS, Windows C++ host and MSIX layout
        shell: powershell
        run: ./scripts/windows/build.ps1
      - name: Upload native package and compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GamePack-windows-x64
          if-no-files-found: warn
          path: |
            artifacts/windows/packages/**
            artifacts/windows/*.binlog
            apps/windows/GamePack.Package/bin/x64/Release/**
